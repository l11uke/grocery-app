<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grocery Receipt Upload</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 480px; margin: 0 auto; padding: 16px; background: #f7f7f5; }
  h1 { font-size: 1.3rem; }
  nav a { font-size: 0.9rem; color: #555; text-decoration: none; }
  #photoInput { display: none; }
  .btn { display: block; width: 100%; padding: 14px; margin: 10px 0; border: none; border-radius: 8px;
         background: #2563eb; color: white; font-size: 1rem; text-align: center; cursor: pointer; }
  .btn:disabled { background: #9ca3af; }
  #preview { width: 100%; border-radius: 8px; margin-top: 10px; display: none; }
  table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 0.85rem; }
  th, td { text-align: left; padding: 6px 4px; border-bottom: 1px solid #ddd; }
  input, select { width: 100%; box-sizing: border-box; padding: 4px; font-size: 0.85rem; }
  #status { font-size: 0.9rem; color: #555; margin-top: 8px; }
  .meta-row { display: flex; gap: 8px; margin-top: 10px; }
  .meta-row div { flex: 1; }
  label { font-size: 0.75rem; color: #666; }
</style>
</head>
<body>
<nav><a href="/">Upload</a> &nbsp;|&nbsp; <a href="/insights">Insights</a></nav>
<h1>Add Receipt</h1>

<input type="file" id="photoInput" accept="image/*" capture="environment">
<button class="btn" id="pickBtn">Take / Choose Photo</button>
<img id="preview">
<div id="status"></div>

<div id="reviewArea" style="display:none;">
  <div class="meta-row">
    <div><label>Store</label><input id="storeInput"></div>
    <div><label>Date</label><input id="dateInput" type="date"></div>
  </div>
  <div class="meta-row">
    <div><label>Printed total</label><input id="totalInput" type="number" step="0.01"></div>
  </div>
  <table id="itemsTable">
    <thead><tr><th>Name</th><th>Category</th><th>Qty</th><th>Total</th><th></th></tr></thead>
    <tbody id="itemsBody"></tbody>
  </table>
  <button class="btn" id="addRowBtn" style="background:#6b7280;">+ Add item</button>
  <button class="btn" id="saveBtn">Save Receipt</button>
</div>

<script>
let categories = [];
fetch('/api/categories').then(r => r.json()).then(c => categories = c);

const pickBtn = document.getElementById('pickBtn');
const photoInput = document.getElementById('photoInput');
const preview = document.getElementById('preview');
const status = document.getElementById('status');
const reviewArea = document.getElementById('reviewArea');
const itemsBody = document.getElementById('itemsBody');

pickBtn.onclick = () => photoInput.click();

photoInput.onchange = async () => {
  const file = photoInput.files[0];
  if (!file) return;
  preview.src = URL.createObjectURL(file);
  preview.style.display = 'block';
  status.textContent = 'Extracting…';
  reviewArea.style.display = 'none';

  const formData = new FormData();
  formData.append('photo', file);

  try {
    const res = await fetch('/api/extract', { method: 'POST', body: formData });
    const data = await res.json();
    if (data.error) { status.textContent = 'Error: ' + data.error; return; }
    populateReview(data);
    status.textContent = 'Review and confirm below.';
  } catch (e) {
    status.textContent = 'Error: ' + e;
  }
};

function populateReview(data) {
  document.getElementById('storeInput').value = data.store || '';
  document.getElementById('dateInput').value = data.purchase_date || '';
  document.getElementById('totalInput').value = data.printed_total ?? '';
  itemsBody.innerHTML = '';
  (data.items || []).forEach(addRow);
  reviewArea.style.display = 'block';
}

function addRow(item = {}) {
  const tr = document.createElement('tr');
  const catOptions = categories.map(c =>
    `<option value="${c}" ${c === item.category ? 'selected' : ''}>${c}</option>`
  ).join('');
  tr.innerHTML = `
    <td><input class="f-name" value="${item.name || ''}"></td>
    <td><select class="f-cat">${catOptions}</select></td>
    <td><input class="f-qty" type="number" step="0.01" value="${item.quantity ?? 1}"></td>
    <td><input class="f-total" type="number" step="0.01" value="${item.line_total ?? 0}"></td>
    <td><button onclick="this.closest('tr').remove()">✕</button></td>
  `;
  itemsBody.appendChild(tr);
}

document.getElementById('addRowBtn').onclick = () => addRow();

document.getElementById('saveBtn').onclick = async () => {
  const items = Array.from(itemsBody.querySelectorAll('tr')).map(tr => ({
    name: tr.querySelector('.f-name').value,
    category: tr.querySelector('.f-cat').value,
    quantity: parseFloat(tr.querySelector('.f-qty').value) || 1,
    line_total: parseFloat(tr.querySelector('.f-total').value) || 0,
  }));

  const payload = {
    store: document.getElementById('storeInput').value,
    purchase_date: document.getElementById('dateInput').value,
    printed_total: parseFloat(document.getElementById('totalInput').value) || null,
    items,
  };

  status.textContent = 'Saving…';
  const res = await fetch('/api/confirm', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload),
  });
  const result = await res.json();
  if (result.error) { status.textContent = 'Error: ' + result.error; return; }
  status.textContent = `Saved receipt #${result.receipt_id}` +
    (result.total_mismatch ? ' — WARNING: computed total does not match printed total.' : '.');
  reviewArea.style.display = 'none';
  preview.style.display = 'none';
  photoInput.value = '';
};
</script>
</body>
</html>
